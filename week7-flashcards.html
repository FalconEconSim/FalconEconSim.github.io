<script>
const CARDS = [
  { id:1, type:"Def",
    q:"What is a price-taking (competitive) firm? What does it mean to be a 'price taker'?",
    a:"A price-taking firm is one that is too small relative to its market to influence the market price. It takes the price as given.\n\nConditions: many buyers and sellers, homogeneous product, free entry and exit, perfect information.\n\nConsequence: the firm faces a horizontal (perfectly elastic) demand curve at the market price P*. It can sell any quantity at P*, but nothing at a higher price.\n\nMR = P* for a price taker: each additional unit sold adds exactly P* to revenue." },

  { id:2, type:"Eq",
    q:"State the profit-maximization rule. Derive it from the definition of profit.",
    a:"Profit: \\(\\pi = TR - TC\\)\n\nMaximize: \\(\\frac{d\\pi}{dq} = 0 \\Rightarrow \\frac{dTR}{dq} - \\frac{dTC}{dq} = 0\\)\n\n\\[MR = MC\\]\n\nFor a price taker, MR = P, so the rule becomes P = MC.\n\nSecond-order condition: MC must be rising at the optimum (so the firm is on the upward-sloping portion of its MC curve).\n\nIf P > MC: produce more (extra revenue exceeds extra cost).\nIf P < MC: produce less (extra cost exceeds extra revenue)." },

  { id:3, type:"Graph",
    q:"Describe the profit rectangle on a per-unit diagram. What is its height? What is its width?",
    a:"On a diagram showing SMC and SAC curves with a horizontal price line P*:\n\nOptimal quantity q* is where P* = SMC (on the rising portion).\n\nProfit rectangle:\n- Width = q* (the output produced)\n- Height = P* - SAC(q*) (price minus average total cost)\n- Area = q* x (P* - SAC(q*)) = total profit\n\nIf P* > SAC(q*): green (positive profit) rectangle above the SAC curve.\nIf P* < SAC(q*): red (negative profit, a loss) rectangle below P*.\nIf P* = SAC(q*): zero economic profit (break-even).\n\nCommon mistake: using SAVC or SMC as the bottom of the rectangle instead of SAC." },

  { id:4, type:"Def",
    q:"What is the shutdown rule? Why should a firm operate even when making a loss?",
    a:"Shutdown rule: Produce if P ≥ min(SAVC). Shut down if P < min(SAVC).\n\nDerivation: A firm shuts down only if it loses MORE by operating than by shutting down.\n- Shutdown loss = -TFC (still owe fixed costs)\n- Operating loss = TR - TVC - TFC\n\nOperate if: TR - TVC - TFC > -TFC\n→ TR > TVC\n→ P > AVC\n\nIntuition: if price covers variable costs, operating covers some fixed costs. Shutting down covers none. So operating is better even at a loss.\n\nNote: TFC is a sunk cost - it does not affect whether to produce, only P vs AVC does." },

  { id:5, type:"Eq",
    q:"Derive the break-even price and the shutdown price for a firm with TC(q) = q^2 + 4q + 9.",
    a:"Given: TC(q) = q^2 + 4q + 9.\n\nSMC = dTC/dq = 2q + 4.\nSAVC = TVC/q = (q^2 + 4q)/q = q + 4.\nSAC = TC/q = q + 4 + 9/q.\n\nShutdown price = min(SAVC).\nd(SAVC)/dq = 1 = 0? SAVC is increasing, so minimum is at q → 0+: P_SD = 4.\n(SAVC = q + 4, which is always increasing, so min SAVC = 4 as q → 0.)\n\nBreak-even price = min(SAC).\nd(SAC)/dq = 1 - 9/q^2 = 0 → q* = 3.\nSAC(3) = 3 + 4 + 9/3 = 10. So P_BE = $10.\n\nSummary: P < $4: shut down. $4 ≤ P < $10: operate at a loss. P = $10: break even. P > $10: positive profit." },

  { id:6, type:"Def",
    q:"What is the short-run supply curve of a competitive firm? How is it derived?",
    a:"The firm's short-run supply curve is the upward-sloping portion of the SMC curve at and above the shutdown price min(SAVC).\n\nBelow min(SAVC): the firm supplies q = 0 (shuts down).\nAt and above min(SAVC): the firm supplies the quantity where P = SMC.\n\nDerivation: For P ≥ P_SD, solve P = SMC for q. This gives q*(P), the supply function.\n\nFor TC(q) = q^2 + 4q + 9: SMC = 2q + 4. Setting P = 2q + 4: q = (P-4)/2 for P ≥ 4.\n\nThe supply curve slopes upward because SMC is increasing (law of diminishing returns)." },

  { id:7, type:"Eq",
    q:"Why does MR = P for a competitive firm? Show the algebra.",
    a:"Total Revenue: TR = P x q (where P is fixed for a price taker).\n\nMR = dTR/dq = d(Pq)/dq = P.\n\nSo MR = P always for a price taker.\n\nGeometrically: the demand curve facing the firm is horizontal at P*. Each unit sold adds exactly P* to revenue - there is no 'price effect' because the firm does not need to lower price to sell more.\n\nContrast with a firm facing downward-sloping demand: each extra unit requires a price cut on ALL existing units, so MR < P." },

  { id:8, type:"Eq",
    q:"For a firm with downward-sloping demand P = a - bq, derive the MR formula and explain the decomposition.",
    a:"TR = P x q = (a - bq)q = aq - bq^2.\n\nMR = dTR/dq = a - 2bq.\n\nObservations:\n- Same intercept as demand (a), but twice the slope (-2b instead of -b).\n- MR < P for any q > 0 (since a - 2bq < a - bq).\n\nDecomposition: selling one more unit has two effects:\n1. Gain: revenue from new unit = P_new (green rectangle, height P_new, width 1)\n2. Loss: price cut on all existing units = q x (-dP) (red rectangle, height ΔP, width q)\n\nMR = P_new - q|dP/dq| = P + q(dP/dq) = (a-bq) + q(-b) = a - 2bq." },

  { id:9, type:"Mistake",
    q:"Common mistake: 'The firm should shut down whenever it is making a loss.' Why is this wrong?",
    a:"This is wrong. A firm should compare two losses:\n\n1. Operating loss = TR - TC = TR - TVC - TFC\n2. Shutdown loss = -TFC (fixed costs still owed even if output = 0)\n\nThe firm should operate if the operating loss is smaller than the shutdown loss:\nTR - TVC - TFC > -TFC\n→ TR > TVC\n→ P > AVC\n\nSo: if P ≥ AVC, operate even at a loss (because revenue covers variable costs and contributes toward fixed costs).\n\nOnly shut down if P < AVC (the firm cannot even cover variable costs).\n\nKey insight: TFC is sunk - it does not affect the shutdown decision. Only P vs AVC matters." },

  { id:10, type:"Def",
    q:"What is zero economic profit in long-run equilibrium? Is this a bad outcome for the firm?",
    a:"In long-run equilibrium in a competitive market, free entry and exit drive economic profit to zero:\n\\[P^* = \\min(LRAC)\\]\n\nThis means: total revenue exactly covers all costs, including implicit costs (the opportunity cost of the owner's time and capital).\n\nIs this bad? No! Zero economic profit means the firm earns its opportunity cost - exactly what the owner's resources would earn in the best alternative use.\n\nAccounting profit is still positive (the owner is being paid their market wage and capital return).\n\nKey insight: 'zero profit' in economics means the firm is doing as well as it could anywhere else - a healthy, efficient outcome." },

  { id:11, type:"Graph",
    q:"Explain the long-run adjustment process when existing firms are earning positive economic profit.",
    a:"Positive economic profit attracts new firms to the market (free entry assumption).\n\nStep-by-step:\n1. Firms earn positive profit: P* > min(SAC).\n2. New firms enter: market supply curve shifts right.\n3. Market price falls (as supply increases, price is bid down).\n4. Each firm's profit rectangle shrinks.\n5. Entry stops when P* = min(SAC) = min(LRAC), so profit = 0.\n\nLong-run equilibrium: n* firms, P* = min(LRAC), each firm produces at efficient scale.\n\nSymmetric process when losses occur: exit → supply shifts left → price rises → losses eliminated." },

  { id:12, type:"Eq",
    q:"Market supply: 100 firms each with supply q_i = (P-4)/2. Write the market supply function Q_S(P).",
    a:"Each firm: q_i = (P-4)/2 for P ≥ 4 (shutdown price = $4).\n\nMarket supply: Q_S = 100 x q_i = 100 x (P-4)/2 = 50(P-4) for P ≥ 4.\n\nSo: Q_S = 50P - 200 for P ≥ 4; Q_S = 0 for P < 4.\n\nInversion: P = Q_S/50 + 4 (inverse supply).\n\nThe market supply curve is steeper (less elastic) than individual firm supply, but shifted right by the factor n = 100.\n\nAs n rises: market supply shifts right → P* falls. This is the long-run entry mechanism." },

  { id:13, type:"Def",
    q:"What is the three-panel causality diagram? Trace through a demand shock step by step.",
    a:"The three-panel diagram shows the market mechanism:\nLeft panel: Typical firm (SMC, SAC curves)\nCenter panel: The market (supply D and demand S curves)\nRight panel: Typical consumer (individual demand d)\n\nShock: Price of a substitute rises.\n\nCausality chain:\n1. Consumer panel: demand shifts from d to d' (substitute is more expensive, consumer wants more of this good).\n2. Market panel: D shifts to D', new equilibrium at higher P* and Q*.\n3. Firm panel: horizontal price line rises from P1 to P2; firm moves up SMC to produce more; profit rectangle appears.\n\nKey point: the market sets the price. Firms and consumers take it as given." },

  { id:14, type:"Graph",
    q:"How does a rise in an input price (e.g., wages) affect a firm's supply curve? Trace all effects.",
    a:"A wage increase shifts both SMC and SAVC upward.\n\nEffects on the firm:\n- SMC shifts up: for each output level, marginal cost is higher.\n- SAVC shifts up: minimum SAVC rises, so the shutdown price rises.\n- The supply curve (SMC above min SAVC) shifts left and up.\n\nEffects on the market:\n- Each firm's supply curve shifts left.\n- Market supply S shifts left.\n- Market price P* rises.\n- Market quantity Q* falls.\n- Firm output q* may rise or fall (P* up, but MC up too).\n\nComparative statics: input price up → supply left → P* up, Q* down." },

  { id:15, type:"Eq",
    q:"A firm has TC(q) = (1/3)q^3 - 2q^2 + 7q + 5 and faces market price P = $8. Find q*, profit, and whether the firm should operate.",
    a:"SMC = dTC/dq = q^2 - 4q + 7.\nSAVC = TVC/q = (q^2 - 4q + 7) + 0 ... actually TVC = TC - TFC = (1/3)q^3 - 2q^2 + 7q.\nSAVC = (1/3)q^2 - 2q + 7. Minimum at q = 3: SAVC(3) = 3 - 6 + 7 = 4.\nSo P_SD = $4.\n\nSAC = (1/3)q^2 - 2q + 7 + 5/q. Min at q ≈ 3.58: SAC ≈ $5.50.\n\nProfit max: P = SMC → 8 = q^2 - 4q + 7 → q^2 - 4q - 1 = 0 → q = 2 + sqrt(5) ≈ 4.24.\n\nSAC(4.24) ≈ $5.60. Profit = (8 - 5.60) x 4.24 ≈ $10.18.\n\nShould the firm operate? Yes: P = $8 > $4 = P_SD." },

  { id:16, type:"Def",
    q:"Distinguish between the shutdown price and the break-even price. What happens in each zone?",
    a:"Shutdown price = min(SAVC). If P < P_SD: firm shuts down (supply = 0).\n\nBreak-even price = min(SAC). If P = P_BE: zero economic profit.\n\nThree zones:\n1. P < min(SAVC): Shut down. Loss = -TFC.\n2. min(SAVC) ≤ P < min(SAC): Operate at a loss. Loss < -TFC (operating is better than shutting down).\n3. P = min(SAC): Break-even. Zero economic profit.\n4. P > min(SAC): Positive economic profit.\n\nNote: min(SAVC) < min(SAC) always (because SAC = SAVC + AFC, and AFC > 0)." },

  { id:17, type:"Mistake",
    q:"Common mistake: 'The profit rectangle uses AVC as its bottom edge.' Why is this wrong?",
    a:"Wrong. The profit rectangle uses SAC (short-run average total cost) as its bottom edge, not SAVC (short-run average variable cost).\n\nCorrect: Profit per unit = P* - SAC(q*). Total profit = q* x (P* - SAC(q*)).\n\nWhy it matters: SAVC excludes fixed costs. Using SAVC as the bottom would give 'profit' that is actually just the contribution to covering fixed costs.\n\nExample: P* = $12, SAVC = $8, SAC = $11, q* = 5.\n- Correct profit: (12-11) x 5 = $5.\n- Wrong 'profit' using SAVC: (12-8) x 5 = $20 (this is total contribution margin, not profit).\n\nThe contribution margin $20 goes to covering TFC = $15 and leaves $5 economic profit." },

  { id:18, type:"Graph",
    q:"What does the market supply curve look like in the short run vs. the long run? How do they differ?",
    a:"Short-run market supply:\n- Fixed number of firms n.\n- Upward sloping (sum of each firm's SMC above min SAVC).\n- Steeper and less elastic.\n\nLong-run market supply:\n- Free entry and exit drive profit to zero.\n- In perfect competition with identical firms and constant input prices: LRMS is horizontal at P* = min(LRAC).\n- Perfectly elastic (flat line).\n\nWhy horizontal in the long run? Any P above min(LRAC) attracts entry → supply rises → P falls back. Any P below min(LRAC) causes exit → supply falls → P rises back. Long-run equilibrium is always at P* = min(LRAC).\n\nWith upward-sloping input supply: LRMS slopes up (as industry grows, input prices rise)." },

  { id:19, type:"Def",
    q:"What is market supply? How is it constructed from individual firm supply curves?",
    a:"Market supply is the horizontal sum of all individual firm supply curves.\n\nConstruction: At each price P, add the quantities supplied by every firm:\n\\[Q_S(P) = \\sum_{i=1}^{n} q_i(P)\\]\n\nNever add prices - always add quantities at a given price.\n\nExample: Firm A supplies q_A = P - 2; Firm B supplies q_B = 2P - 4 (for P ≥ 2).\nMarket supply: Q_S = q_A + q_B = 3P - 6 for P ≥ 2.\n\nAs n rises: market supply shifts right; market price falls; individual firms produce the same (their supply curve hasn't changed) but there are more of them." },

  { id:20, type:"Mistake",
    q:"True or False: 'Economic profit > 0 means the firm's owner is getting rich.' Is this true?",
    a:"Not exactly. Here is the precise interpretation:\n\nEconomic profit = Accounting profit - Implicit costs (opportunity costs of owner-supplied inputs).\n\nEconomic profit > 0: the firm earns MORE than the owner's next-best alternative. The owner is genuinely better off in this business.\n\nEconomic profit = 0: the firm earns EXACTLY the opportunity cost. The owner earns a fair return - not getting 'rich' in an economic sense, but not losing out either. This is the long-run equilibrium.\n\nAccounting profit is still positive at zero economic profit (the owner is being paid their market wage and return on capital).\n\nBottom line: zero economic profit is healthy and efficient - it just means there are no excess returns attracting further entry." }
];

// engine
const TYPES = [...new Set(CARDS.map(c=>c.type))];
const COL = {Def:'var(--unit-ink)',Eq:'var(--ink-faint)',Graph:'var(--d-gain)',Mistake:'var(--d-loss)'};
const BG  = {Def:'var(--paper-raised)',Eq:'var(--paper-raised)',Graph:'var(--paper-raised)',Mistake:'var(--paper-raised)'};
let deck=[],idx=0,flipped=false,stats={Easy:0,Good:0,Hard:0},filter='All',ratings={};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rebuildDeck(){deck=shuffle(CARDS.filter(c=>filter==='All'||c.type===filter));idx=0;stats={Easy:0,Good:0,Hard:0};ratings={};}
function render(){
  const root=document.getElementById('fc-root');
  if(idx>=deck.length){root.innerHTML=summary();if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([root]).catch(()=>{});return;}
  const c=deck[idx];const col=COL[c.type]||'var(--unit-ink)';const bg=BG[c.type]||'var(--paper-raised)';
  const total=deck.length;
  root.innerHTML=`
    <div class="fc-hdr">
      <span class="fc-title">EC224 &middot; Week 7 &middot; Profit Maximization</span>
      <span class="fc-ctr">${idx+1} / ${total}</span>
    </div>
    <div class="fc-prog"><div class="fc-prog-fill" style="width:${(idx/total*100).toFixed(1)}%"></div></div>
    <div class="fc-filters">
      ${['All',...TYPES].map(t=>`<button class="fc-ftag${filter===t?' active':''}" onclick="setFilter('${t}')">${t}</button>`).join('')}
    </div>
    <div class="fc-scene" id="fc-card-zone">
      <div class="fc-card-inner" id="fc-inner">
        <div class="fc-front" onclick="flipCard()">
          <div class="fc-q-sm">
            <span class="fc-badge" style="background:${bg};color:${col}">${c.type}</span>
          </div>
          <div class="fc-q">${c.q}</div>
          <div class="fc-hint">Click to reveal answer &nbsp;<span class="fc-kbd">Space</span></div>
        </div>
        <div class="fc-back">
          <div class="fc-q-sm" style="color:${col}">Answer</div>
          <div class="fc-a fc-reveal">${c.a}</div>
          <div class="fc-rate-label" style="margin-top:0.85rem">How well did you know this?</div>
          <div class="fc-rate-row">
            <button class="fc-rbtn" style="color:var(--d-loss);border-color:var(--d-transfer)" onclick="rate('Hard')">
              Again<div class="kh"><span class="fc-kbd">1</span></div>
            </button>
            <button class="fc-rbtn" style="color:var(--unit-ink);border-color:var(--unit-ink)" onclick="rate('Good')">
              Good<div class="kh"><span class="fc-kbd">2</span></div>
            </button>
            <button class="fc-rbtn" style="color:var(--d-gain);border-color:var(--d-gain)" onclick="rate('Easy')">
              Easy<div class="kh"><span class="fc-kbd">3</span></div>
            </button>
          </div>
        </div>
      </div>
    </div>`;
  if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([root]).catch(()=>{});
}
function summary(){
  const t=stats.Easy+stats.Good+stats.Hard;
  return `<div class="fc-summary">
    <div class="fc-sum-title">Deck complete!</div>
    <div class="fc-stat-row">
      <div class="fc-stat" style="background:var(--paper-raised)"><div class="fc-stat-n" style="color:var(--d-gain)">${stats.Easy}</div><div class="fc-stat-l" style="color:var(--d-gain)">Easy</div></div>
      <div class="fc-stat" style="background:var(--paper-raised)"><div class="fc-stat-n" style="color:var(--unit-ink)">${stats.Good}</div><div class="fc-stat-l" style="color:var(--unit-ink)">Good</div></div>
      <div class="fc-stat" style="background:var(--paper-raised)"><div class="fc-stat-n" style="color:var(--d-loss)">${stats.Hard}</div><div class="fc-stat-l" style="color:var(--d-loss)">Again</div></div>
    </div>
    <div class="fc-bar-track">
      <div class="fc-bar-seg" style="width:${(stats.Easy/t*100).toFixed(1)}%;background:var(--d-gain)"></div>
      <div class="fc-bar-seg" style="width:${(stats.Good/t*100).toFixed(1)}%;background:var(--unit-ink)"></div>
      <div class="fc-bar-seg" style="width:${(stats.Hard/t*100).toFixed(1)}%;background:var(--d-transfer)"></div>
    </div>
    <div class="fc-btn-row">
      <button class="fc-btn-primary" onclick="restart()">Study again</button>
      <button class="fc-btn-outline" onclick="restartHard()">Review missed</button>
    </div>
  </div>`;
}
function flipCard(){flipped=!flipped;document.getElementById('fc-inner')?.classList.toggle('flipped',flipped);}
function rate(r){
  const c=deck[idx];if(c)ratings[c.id]=r;
  stats[r]++;flipped=false;idx++;
  const zone=document.getElementById('fc-card-zone');
  if(zone){zone.classList.add('fc-zone-exit');setTimeout(()=>{zone.classList.remove('fc-zone-exit');render();},180);}
  else render();
}
function setFilter(f){filter=f;rebuildDeck();render();}
function restart(){rebuildDeck();render();}
function restartHard(){const hard=deck.filter(c=>ratings[c.id]==='Hard');deck=shuffle(hard.length?hard:(CARDS.filter(c=>filter==='All'||c.type===filter)));idx=0;stats={Easy:0,Good:0,Hard:0};ratings={};render();}
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();flipCard();}
  if(e.code==='Digit1')rate('Hard');
  if(e.code==='Digit2')rate('Good');
  if(e.code==='Digit3')rate('Easy');
});
rebuildDeck();render();
function openLN(){document.getElementById('leftNav').classList.add('open');document.getElementById('lnOverlay').classList.add('open');}
function closeLN(){document.getElementById('leftNav').classList.remove('open');document.getElementById('lnOverlay').classList.remove('open');}
</script>
  <!-- Ask the Course AI, floating 24/7 assistant -->
  <script src="assets/chatbot.js"></script>
  <script src="assets/ask-widget.js"></script>
</body>
</html>
