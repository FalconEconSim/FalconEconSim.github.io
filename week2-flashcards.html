      font-size: 12px; color: #BCC8D8; text-align: center;
      margin-bottom: 0.5rem; letter-spacing: 0.03em;

      display: flex; flex-direction: column; align-items: center; gap: 2px;

    .fc-rbtn:hover { opacity: 0.8; transform: scale(0.98); }

    .fc-reveal {

    /* Card zone slide transitions */

    .fc-zone-exit  { animation: fc-zone-exit  0.18s cubic-bezier(.4,0,1,1) forwards; }

    /* Summary screen */

<script>
/* ============================================================
   EC224 Week 2 Flashcards
   ============================================================ */

const CARDS = [
  { id:1,  type:"Def",
    q:"What is a budget constraint, and what does it represent geometrically?",
    a:"All combinations of goods a consumer can afford given income \\(I\\) and prices \\(P_X, P_Y\\). Geometrically: a straight line with x-intercept \\(I/P_X\\), y-intercept \\(I/P_Y\\), and slope \\(-P_X/P_Y\\). Points on or inside the line are feasible." },
  { id:2,  type:"Def",
    q:"What does the slope of the budget line equal, and what does it mean economically?",
    a:"Slope \\(= -P_X/P_Y\\). The market's rate of exchange: how many units of Y you must give up to buy one more unit of X. This is the opportunity cost of X in terms of Y." },
  { id:3,  type:"Def",
    q:"What is an indifference curve, and what property guarantees they never cross?",
    a:"A curve showing all bundles yielding the same utility. They never cross because preferences are transitive and monotone. If two curves crossed, a single bundle would imply two different utility levels, a contradiction." },
  { id:4,  type:"Def",
    q:"Define the Marginal Rate of Substitution. How is it related to marginal utilities?",
    a:"MRS = the rate at which a consumer willingly trades Y for one more X, holding utility constant. \\(\\text{MRS} = MU_X / MU_Y\\). It equals the absolute slope of the indifference curve at any bundle." },
  { id:5,  type:"Def",
    q:"What is the consumer optimum? State it in both graphical and algebraic terms.",
    a:"The affordable bundle maximising utility. Graphically: the highest indifference curve tangent to the budget line. Algebraically: \\(\\text{MRS} = P_X/P_Y\\) and \\(P_X x + P_Y y = I\\) both hold simultaneously." },
  { id:6,  type:"Def",
    q:"What distinguishes a corner solution from an interior solution?",
    a:"An interior solution has \\(x^*>0\\) and \\(y^*>0\\) with tangency condition \\(\\text{MRS}=P_X/P_Y\\). A corner solution has \\(x^*=0\\) or \\(y^*=0\\). The consumer spends all income on one good (e.g. perfect substitutes when MRS does not equal \\(P_X/P_Y\\) at any interior point)." },
  { id:7,  type:"T/F",
    q:"A steeper indifference curve implies a higher MRS.",
    a:"True. MRS equals the absolute slope of the indifference curve. Steeper = larger MRS. The consumer requires more Y to compensate for losing one unit of X, reflecting stronger preference for X at that bundle." },
  { id:8,  type:"T/F",
    q:"If income doubles and both prices double, the budget set is unchanged.",
    a:"True. The budget set is \\(P_X x + P_Y y \\leq I\\). Multiplying \\(I\\), \\(P_X\\), and \\(P_Y\\) by the same constant leaves intercepts \\(I/P_X\\) and \\(I/P_Y\\) unchanged. Only relative prices and real income matter." },
  { id:9,  type:"T/F",
    q:"Two indifference curves for the same consumer can intersect if the consumer is indifferent between the bundles.",
    a:"False. If they crossed, the intersection bundle would lie on both curves, implying two different utility levels simultaneously, violating transitive, consistent preferences." },
  { id:10, type:"T/F",
    q:"At the consumer optimum, the consumer has exhausted all gains from trade with the market.",
    a:"True. At \\(\\text{MRS}=P_X/P_Y\\), subjective valuation equals the market's exchange rate. No reallocation of spending can increase utility. All mutually beneficial trades have been made." },
  { id:11, type:"T/F",
    q:"For perfect complements, the MRS is defined everywhere along the indifference curve.",
    a:"False. Perfect complement curves are L-shaped. At the kink (vertex) MRS is undefined. Along vertical/horizontal segments the slope is 0 or infinity." },
  { id:12, type:"T/F",
    q:"A rise in \\(P_X\\) rotates the budget line inward along the x-axis only, leaving the y-intercept unchanged.",
    a:"True. The y-intercept \\(I/P_Y\\) is unaffected by a change in \\(P_X\\). The x-intercept \\(I/P_X\\) falls as \\(P_X\\) rises. The line pivots inward around the y-intercept, becoming steeper." },
  { id:13, type:"Eq",
    q:"At the consumer optimum, MRS = ___",
    a:"\\(\\text{MRS} = P_X / P_Y\\)\n\nThe tangency condition. Consumer's willingness to trade must equal the market's rate of exchange. If \\(\\text{MRS} > P_X/P_Y\\), the consumer values X more than the market and should buy more X." },
  { id:14, type:"Eq",
    q:"For \\(U = X^\\alpha Y^\\beta\\) (Cobb-Douglas), the optimal share of income spent on X is ___",
    a:"\\(P_X x^* = \\dfrac{\\alpha}{\\alpha+\\beta} \\cdot I\\)\n\nA fixed fraction \\(\\alpha/(\\alpha+\\beta)\\) of income is always spent on X, regardless of prices. Demand for X is independent of \\(P_Y\\)." },
  { id:15, type:"Eq",
    q:"The budget constraint can be written as ___ = I",
    a:"\\(P_X \\cdot x + P_Y \\cdot y = I\\)\n\nSpending on X plus Y exhausts income. Points below the line leave income unspent, which is suboptimal under monotone preferences." },
  { id:16, type:"Eq",
    q:"\\(\\text{MRS} = MU_X/MU_Y\\). For \\(U = xy\\), compute MRS at bundle (2, 4).",
    a:"\\(MU_X = y = 4,\\quad MU_Y = x = 2\\)\n\\(\\text{MRS} = 4/2 = 2\\)\n\nAt (2, 4) the consumer trades 2 units of Y for 1 more X. If \\(P_X/P_Y < 2\\), they should buy more X." },
  { id:17, type:"Eq",
    q:"For perfect substitutes \\(U = aX + bY\\), what is the optimum when \\(P_X/P_Y < a/b\\)?",
    a:"Corner solution: \\(x^* = I/P_X,\\; y^* = 0\\)\n\nX is cheap relative to how much the consumer values it. Every dollar buys more utility via X, so spend all income on X. \\(\\text{MRS} = a/b > P_X/P_Y\\) at every interior point." },
  { id:18, type:"Graph",
    q:"A bundle lies strictly below the budget line. Is it feasible? Is it optimal? Why or why not?",
    a:"Feasible: Yes, since \\(P_X x + P_Y y < I\\).\nOptimal: No. Under monotone preferences there always exists a bundle on the budget line with more of at least one good. Leaving income unspent cannot be optimal." },
  { id:19, type:"Graph",
    q:"The budget line cuts through an indifference curve (not tangent). Can the consumer do better?",
    a:"Yes. When the line crosses the curve, part of the budget line lies above it, reaching a higher indifference curve. The consumer moves along the budget line to higher utility. Only at tangency is no improvement possible." },
  { id:20, type:"Graph",
    q:"How does the optimal bundle shift when \\(P_X\\) falls, for a Cobb-Douglas consumer? Which curve moves?",
    a:"Budget line rotates outward (y-intercept fixed; x-intercept rises). Indifference curve map is fixed. New optimum is on a higher curve. \\(x^* = \\alpha I/[(\\alpha+\\beta)P_X]\\) rises; \\(y^*\\) unchanged." },
];

const TS = {
  Def:   { bg:"#E6F1FB", color:"#185FA5", label:"Definition" },
  "T/F": { bg:"#FAEEDA", color:"#854F0B", label:"True / False" },
  Eq:    { bg:"#EAF3DE", color:"#3B6D11", label:"Equation" },
  Graph: { bg:"#FAECE7", color:"#993C1D", label:"Graphical" },
};
const TYPES = ["All", "Def", "T/F", "Eq", "Graph"];
const RLABEL = { got:"Got it", almost:"Almost", missed:"Missed" };
const RSYM   = { got:"✓", almost:"~", missed:"✕" };
const RCOLORS = { got:"#3B6D11", almost:"#854F0B", missed:"#993C1D" };
const RBGS    = { got:"#EAF3DE", almost:"#FAEEDA", missed:"#FAECE7" };

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

/* App state */
let state = {
  filter: "All",
  deck: shuffle(CARDS),
  idx: 0,
  flipped: false,
  ratings: {},
  done: false,
  streak: 0,
  bestStreak: 0,
};

function base() {
  return state.filter === "All" ? CARDS : CARDS.filter(c => c.type === state.filter);
}
function card() { return state.deck[state.idx]; }
function pct()  { return Math.round((state.idx / state.deck.length) * 100); }
function got()    { return Object.values(state.ratings).filter(r => r === "got").length; }
function almost() { return Object.values(state.ratings).filter(r => r === "almost").length; }
function missed() { return Object.values(state.ratings).filter(r => r === "missed").length; }
function total()  { return got() + almost() + missed(); }

const root = document.getElementById('fc-root');

// ─── RENDER HELPERS ──────────────────────────────────────────────────────────

function hdrRightHTML() {
  return state.streak >= 2
    ? `<div style="display:flex;align-items:center;gap:8px"><span class="fc-streak">🔥 ${state.streak}</span><span class="fc-ctr">${state.idx+1} / ${state.deck.length}</span></div>`
    : `<span class="fc-ctr">${state.idx+1} / ${state.deck.length}</span>`;
}

function cardZoneHTML(c, ts) {
  return `
    <div class="fc-scene">
      <div class="fc-card-inner" id="fc-inner" style="position:relative">
        <div class="fc-front" id="fc-front-el">
          <div class="fc-q">${c.q}</div>
          <div class="fc-hint">tap to flip &nbsp;<span class="fc-kbd">space</span></div>
        </div>
        <div class="fc-back">
          <div class="fc-q-sm">${c.q}</div>
          <div class="fc-a">${c.a}</div>
        </div>
      </div>
    </div>`;
}

function revealBtnsHTML() {
  return `<div class="fc-reveal">
    <div class="fc-rate-label">How did you do? &nbsp;<span class="fc-kbd">1</span><span class="fc-kbd">2</span><span class="fc-kbd">3</span></div>
    <div class="fc-rate-row">
      ${[["got","#3B6D11","#EAF3DE","1"],["almost","#854F0B","#FAEEDA","2"],["missed","#993C1D","#FAECE7","3"]].map(([key,color,bg,k]) => `
        <button class="fc-rbtn" style="border-color:${bg};color:${color}" data-rate="${key}">
          <span style="font-size:15px">${RSYM[key]}</span>
          ${RLABEL[key]}
          <span class="kh"><span class="fc-kbd">${k}</span></span>
        </button>`).join('')}
    </div>
  </div>`;
}

function attachCardHandlers() {
  const fe = document.getElementById('fc-front-el');
  if (fe) fe.addEventListener('click', flipCard);
  root.querySelectorAll('.fc-rbtn').forEach(btn => btn.addEventListener('click', () => rate(btn.dataset.rate)));
}

// ─── FULL RENDER (first render, filter change, restart) ──────────────────────

function render() {
  if (state.done) { renderDone(); return; }
  renderCard();
}

function renderCard() {
  const c = card();
  if (!c) return;
  const ts = TS[c.type] || TS.Def;

  root.innerHTML = `
    <div class="fc-hdr">
      <span class="fc-title">EC224 · Week 2</span>
      ${hdrRightHTML()}
    </div>
    <div class="fc-prog"><div class="fc-prog-fill" style="width:${pct()}%"></div></div>
    <div class="fc-filters">
      ${TYPES.map(t => `<button class="fc-ftag${state.filter===t?' active':''}" data-filter="${t}">${t==="All"?"All types":(TS[t]?.label||t)}</button>`).join('')}
    </div>
    <span class="fc-badge" style="background:${ts.bg};color:${ts.color}">${ts.label}</span>
    <div id="fc-card-zone">
      ${cardZoneHTML(c, ts)}
    </div>
  `;

  root.querySelectorAll('.fc-ftag').forEach(btn => btn.addEventListener('click', () => applyFilter(btn.dataset.filter)));
  attachCardHandlers();
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([root]).catch(()=>{});
}

// ─── FLIP (CSS class toggle, no DOM rebuild) ──────────────────────────────────

function flipCard() {
  if (state.flipped) return;
  state.flipped = true;

  const inner = document.getElementById('fc-inner');
  const zone  = document.getElementById('fc-card-zone');
  if (inner && zone) {
    inner.classList.add('flipped');
    // Inject rating buttons after the flip animation completes (380ms transition)
    setTimeout(function() {
      if (zone.querySelector('.fc-reveal')) return;
      const div = document.createElement('div');
      div.innerHTML = revealBtnsHTML();
      const reveal = div.firstElementChild;
      zone.appendChild(reveal);
      reveal.querySelectorAll('.fc-rbtn').forEach(btn => btn.addEventListener('click', () => rate(btn.dataset.rate)));
    }, 320);
    return;
  }
  // Fallback: full re-render
  render();
}

// ─── RATE (slide-out current, slide-in next) ──────────────────────────────────

function rate(key) {
  const c = card();
  if (!c) return;
  state.ratings = { ...state.ratings, [c.id]: key };
  const newStreak = key === "got" ? state.streak + 1 : 0;
  state.streak = newStreak;
  if (newStreak > state.bestStreak) state.bestStreak = newStreak;

  // Determine next state upfront (before animation)
  const next = state.idx + 1;
  let nextDeck = state.deck, nextIdx = next, willDone = false;
  if (next >= state.deck.length) {
    const retry = state.deck.filter(cc => state.ratings[cc.id] !== "got");
    if (!retry.length) { willDone = true; }
    else { nextDeck = shuffle(retry); nextIdx = 0; }
  }

  const zone = document.getElementById('fc-card-zone');
  if (!zone) {
    // No animated zone: instant update
    if (willDone) { state.done = true; render(); return; }
    state.deck = nextDeck; state.idx = nextIdx; state.flipped = false;
    render(); return;
  }

  zone.classList.add('fc-zone-exit');

  zone.addEventListener('animationend', function onExit() {
    zone.removeEventListener('animationend', onExit);
    zone.classList.remove('fc-zone-exit');

    if (willDone) { state.done = true; render(); return; }

    state.deck = nextDeck;
    state.idx = nextIdx;
    state.flipped = false;

    // Update static parts without rebuilding root
    const hdrEl = root.querySelector('.fc-hdr');
    if (hdrEl) hdrEl.innerHTML = `<span class="fc-title">EC224 · Week 2</span>${hdrRightHTML()}`;
    const pf = root.querySelector('.fc-prog-fill');
    if (pf) pf.style.width = pct() + '%';

    // Swap badge
    const c2 = card(), ts2 = TS[c2.type] || TS.Def;
    const badge = root.querySelector('.fc-badge');
    if (badge) { badge.style.background = ts2.bg; badge.style.color = ts2.color; badge.textContent = ts2.label; }

    // Swap card content and slide in
    zone.innerHTML = cardZoneHTML(c2, ts2);
    zone.classList.add('fc-zone-enter');
    zone.addEventListener('animationend', function onEnter() {
      zone.removeEventListener('animationend', onEnter);
      zone.classList.remove('fc-zone-enter');
    }, { once: true });

    attachCardHandlers();
    if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([zone]).catch(()=>{});
  }, { once: true });
}

function renderDone() {
  const g = got(), a = almost(), m = missed(), tot = total();
  const pctGot = tot ? Math.round((g/tot)*100) : 0;
  const missedCards = base().filter(c => state.ratings[c.id] !== "got");

  root.innerHTML = `
    <div class="fc-hdr">
      <span class="fc-title">EC224 · Week 2</span>
      ${state.bestStreak > 2 ? `<span class="fc-streak">🔥 Best: ${state.bestStreak}</span>` : ''}
    </div>
    <div class="fc-summary">
      <div class="fc-sum-title">Deck complete</div>
      <div style="font-size:13px;color:#666">
        ${g === tot ? "Perfect round. You nailed every card." : `${pctGot}% confidence · ${tot} cards rated`}
      </div>
      <div class="fc-stat-row">
        <div class="fc-stat" style="background:#EAF3DE"><span class="fc-stat-n" style="color:#3B6D11">${g}</span><span class="fc-stat-l" style="color:#3B6D11">Got it</span></div>
        <div class="fc-stat" style="background:#FAEEDA"><span class="fc-stat-n" style="color:#854F0B">${a}</span><span class="fc-stat-l" style="color:#854F0B">Almost</span></div>
        <div class="fc-stat" style="background:#FAECE7"><span class="fc-stat-n" style="color:#993C1D">${m}</span><span class="fc-stat-l" style="color:#993C1D">Missed</span></div>
      </div>
      <div class="fc-bar-track">
        <div class="fc-bar-seg" style="width:${tot?Math.round((g/tot)*100):0}%;background:#3B6D11"></div>
        <div class="fc-bar-seg" style="width:${tot?Math.round((a/tot)*100):0}%;background:#854F0B"></div>
        <div class="fc-bar-seg" style="width:${tot?Math.round((m/tot)*100):0}%;background:#993C1D"></div>
      </div>
      ${g < tot ? `<div style="font-size:12px;color:#999">Tip: review missed cards in your textbook before attempting practice problems.</div>` : ''}
      <div class="fc-btn-row">
        <button class="fc-btn-outline" id="btn-dl-md">Download Markdown</button>
        <button class="fc-btn-outline" id="btn-dl-pdf">Download PDF</button>
      </div>
      <div class="fc-btn-row">
        ${missedCards.length > 0 ? `<button class="fc-btn-outline" id="btn-retry">Retry weak cards (${missedCards.length})</button>` : ''}
        <button class="fc-btn-primary" id="btn-restart">Start again</button>
      </div>
    </div>
  `;

  document.getElementById('btn-dl-md')?.addEventListener('click', downloadMD);
  document.getElementById('btn-dl-pdf')?.addEventListener('click', downloadPDF);
  document.getElementById('btn-retry')?.addEventListener('click', () => restart(true));
  document.getElementById('btn-restart')?.addEventListener('click', () => restart(false));
}

function applyFilter(f) {
  state.filter = f;
  const src = f === "All" ? CARDS : CARDS.filter(c => c.type === f);
  state.deck = shuffle(src);
  state.idx = 0; state.flipped = false;
  state.ratings = {}; state.done = false; state.streak = 0; state.bestStreak = 0;
  render();
}

function restart(missedOnly) {
  const src = missedOnly ? base().filter(c => state.ratings[c.id] !== "got") : base();
  state.deck = shuffle(src); state.idx = 0; state.flipped = false;
  state.ratings = {}; state.done = false; state.streak = 0; state.bestStreak = 0;
  render();
}

function downloadMD() {
  const date = new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
  const g = got(), a = almost(), m = missed();
  const secs = ["got","almost","missed"].map(key => {
    const cards = CARDS.filter(c => state.ratings[c.id] === key);
    if (!cards.length) return "";
    return `## ${RLABEL[key]} (${cards.length})\n\n` + cards.map(c => `### [${c.type}] ${c.q}\n**Answer:** ${c.a}`).join("\n\n");
  }).filter(Boolean).join("\n\n---\n\n");
  const md = `# EC224 Week 2 Flashcard Summary\n**Date:** ${date} | **Got it:** ${g} · **Almost:** ${a} · **Missed:** ${m} | **Best streak:** ${state.bestStreak}\n\n---\n\n${secs}`;
  const el = document.createElement("a");
  el.href = URL.createObjectURL(new Blob([md],{type:"text/markdown"}));
  el.download = "EC224-Week2-Flashcards.md"; el.click();
}

function downloadPDF() {
  const date = new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
  const g = got(), a = almost(), m = missed(), tot = total();
  const pctGot = tot ? Math.round((g/tot)*100) : 0;
  const rows = CARDS.map(c => {
    const r = state.ratings[c.id]; if (!r) return "";
    return `<tr><td>${c.type}</td><td>${c.q}</td><td>${c.a.replace(/\n/g,"<br>")}</td>
    <td><span style="background:${RBGS[r]};color:${RCOLORS[r]};padding:3px 9px;border-radius:99px;font-size:11px">${RLABEL[r]}</span></td></tr>`;
  }).join("");
  const bar = (n, bg) => `<div style="background:${bg};width:${tot?Math.round((n/tot)*100):0}%;height:10px;border-radius:99px"></div>`;
  const w = window.open("","_blank");
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><style>
    body{font-family:Arial,sans-serif;padding:36px;color:#111;max-width:920px;margin:0 auto}
    h1{font-size:20px;color:#0077C8;margin-bottom:2px}
    .meta{font-size:12px;color:#666;margin-bottom:20px}
    .stats{display:flex;gap:10px;margin-bottom:16px}
    .stat{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600}
    .bar-wrap{display:flex;gap:4px;align-items:center;margin-bottom:24px;background:#f0f4fa;border-radius:99px;overflow:hidden;height:10px}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th{background:#0077C8;color:#fff;padding:8px 10px;text-align:left}
    td{padding:8px 10px;border-bottom:1px solid #eee;vertical-align:top}
    tr:nth-child(even) td{background:#fafbfd}
  </style></head><body>
  <h1>EC224 Week 2 Flashcard Summary</h1>
  <div class="meta">Date: ${date} | Score: ${g} got it, ${a} almost, ${m} missed | Best streak: ${state.bestStreak} | Confidence: ${pctGot}%</div>
  <div class="stats">
    <div class="stat" style="background:#EAF3DE;color:#3B6D11">${g} Got it</div>
    <div class="stat" style="background:#FAEEDA;color:#854F0B">${a} Almost</div>
    <div class="stat" style="background:#FAECE7;color:#993C1D">${m} Missed</div>
  </div>
  <div class="bar-wrap">${bar(g,"#3B6D11")}${bar(a,"#854F0B")}${bar(m,"#993C1D")}</div>
  <table><thead><tr><th width="55">Type</th><th width="28%">Question</th><th>Answer</th><th width="85">Result</th></tr></thead>
  <tbody>${rows}</tbody></table>
  </body></html>`);
  w.document.close();
  setTimeout(() => w.print(), 400);
}

/* Keyboard shortcuts */
document.addEventListener('keydown', e => {
  if (state.done) return;
  if (e.code === 'Space') { e.preventDefault(); if (!state.flipped) flipCard(); }
  if (state.flipped) {
    if (e.key === '1') rate('got');
    if (e.key === '2') rate('almost');
    if (e.key === '3') rate('missed');
  }
});

render();

function openLN()  { document.getElementById('leftNav').classList.add('open'); document.getElementById('lnOverlay').classList.add('open'); }
function closeLN() { document.getElementById('leftNav').classList.remove('open'); document.getElementById('lnOverlay').classList.remove('open'); }
</script>
</body>
</html>
