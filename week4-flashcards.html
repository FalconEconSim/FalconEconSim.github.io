<script>
const CARDS = [
  { id:1, type:"Def",
    q:"Define the price elasticity of demand. What does the sign always tell you?",
    a:"The percentage change in quantity demanded for a one percent change in own price:\n\n\\(e_d = \\dfrac{\\%\\Delta Q_X}{\\%\\Delta P_X} = \\dfrac{\\Delta Q_X}{\\Delta P_X}\\cdot\\dfrac{P_X}{Q_X}\\)\n\nAlways negative: price and quantity move in opposite directions (Law of Demand). We report \\(|e_d|\\) to compare magnitudes." },

  { id:2, type:"Def",
    q:"When is demand elastic, and what does it mean in plain English?",
    a:"Demand is elastic when \\(e_d < -1\\), i.e. \\(|e_d| > 1\\).\n\nThe percentage change in quantity exceeds the percentage change in price. Consumers are price-sensitive - a small price increase drives a large quantity drop.\n\nExample: branded coffee (many near-substitutes available)." },

  { id:3, type:"Def",
    q:"When is demand inelastic, and what does it mean in plain English?",
    a:"Demand is inelastic when \\(-1 < e_d < 0\\), i.e. \\(|e_d| < 1\\).\n\nThe percentage change in quantity is smaller than the percentage change in price. Consumers are price-insensitive - a price increase causes only a small quantity drop.\n\nExample: insulin, petrol (no close substitutes, necessity)." },

  { id:4, type:"Def",
    q:"What is unit elastic demand, and why is it significant for revenue?",
    a:"Demand is unit elastic when \\(e_d = -1\\), i.e. \\(|e_d| = 1\\).\n\nA 1% price change causes exactly a 1% change in quantity in the opposite direction. Total revenue \\(TR = P \\times Q\\) is maximised here on a linear demand curve. A small price change in either direction leaves TR unchanged." },

  { id:5, type:"Eq",
    q:"For a linear demand \\(Q = a - bP\\), write the point elasticity formula and explain why it varies along the curve.",
    a:"\\[e_d = -b \\cdot \\frac{P}{Q} = -b \\cdot \\frac{P}{a - bP}\\]\n\nThe slope \\(\\Delta Q / \\Delta P = -b\\) is constant everywhere on a linear demand. But the ratio \\(P/Q\\) rises as price rises (P grows while Q shrinks). So \\(|e_d|\\) increases toward the top - demand becomes more elastic at higher prices." },

  { id:6, type:"Eq",
    q:"State the arc (midpoint) elasticity formula. Why is it preferred over a simple point formula for large changes?",
    a:"\\[e_{arc} = \\frac{(Q_2 - Q_1)/\\overline{Q}}{(P_2 - P_1)/\\overline{P}}\\quad\\text{where }\\overline{Q}=\\tfrac{Q_1+Q_2}{2},\\ \\overline{P}=\\tfrac{P_1+P_2}{2}\\]\n\nThe midpoint formula uses averages as the base, so it is symmetric: going from A→B gives the same number as B→A. A simple percentage-change formula gives different answers depending on direction." },

  { id:7, type:"Eq",
    q:"Elastic demand: what happens to total revenue when price rises? Show algebraically.",
    a:"TR falls when demand is elastic and price rises.\n\n\\(TR = P \\times Q\\). When \\(|e_d| > 1\\):\n\\[|\\%\\Delta Q| > |\\%\\Delta P| \\implies \\text{quantity effect dominates}\\]\n\nRevenue lost from fewer units sold outweighs revenue gained from the higher price.\n\n\\(P\\uparrow \\Rightarrow Q\\downarrow\\downarrow \\Rightarrow TR\\downarrow\\)\n\nConclusion: to raise TR with elastic demand, cut price." },

  { id:8, type:"Eq",
    q:"Inelastic demand: what happens to total revenue when price rises? Show algebraically.",
    a:"TR rises when demand is inelastic and price rises.\n\n\\(TR = P \\times Q\\). When \\(|e_d| < 1\\):\n\\[|\\%\\Delta Q| < |\\%\\Delta P| \\implies \\text{price effect dominates}\\]\n\nRevenue gained from the higher price exceeds the revenue lost from fewer units sold.\n\n\\(P\\uparrow \\Rightarrow Q\\downarrow \\Rightarrow TR\\uparrow\\)\n\nConclusion: to raise TR with inelastic demand, raise price." },

  { id:9, type:"Def",
    q:"Define income elasticity of demand. How does the sign differ for normal, luxury, and inferior goods?",
    a:"\\[e_d^I = \\frac{\\%\\Delta Q_X}{\\%\\Delta I}\\]\n\nNormal good: \\(e_d^I > 0\\) - demand rises with income.\nLuxury good: \\(e_d^I > 1\\) - demand rises proportionally more than income.\nInferior good: \\(e_d^I < 0\\) - demand falls as income rises.\n\nCobb-Douglas demand always yields \\(e_d^I = 1\\) (normal, but not luxury)." },

  { id:10, type:"Def",
    q:"Define cross-price elasticity of demand. How does the sign classify goods as substitutes or complements?",
    a:"\\[e_d^{CP} = \\frac{\\%\\Delta Q_X}{\\%\\Delta P_Y}\\]\n\nSubstitutes: \\(e_d^{CP} > 0\\). When \\(P_Y\\) rises, consumers switch to X.\nExample: Coke and Pepsi.\n\nComplements: \\(e_d^{CP} < 0\\). When \\(P_Y\\) rises, less Y is bought, and less X too.\nExample: coffee and creamer." },

  { id:11, type:"T/F",
    q:"True or False: Elasticity is constant along a linear demand curve.",
    a:"False. Along \\(Q = a - bP\\), slope \\(\\Delta Q/\\Delta P = -b\\) is constant, but elasticity is \\(e_d = -b \\cdot P/Q\\). Since \\(P/Q\\) changes as we move along the curve, so does elasticity.\n\nElasticity increases (more negative) at higher prices. The curve is elastic above its midpoint and inelastic below it." },

  { id:12, type:"T/F",
    q:"True or False: A steeper demand curve always implies lower elasticity at every price.",
    a:"False. Elasticity depends on both slope and the \\(P/Q\\) ratio. Two curves can have the same slope but very different elasticities at the same price if their intercepts differ.\n\nRule: compare elasticities at the same \\((P, Q)\\) point - not just by looking at slopes." },

  { id:13, type:"T/F",
    q:"True or False: For \\(Q = a - bP\\), elasticity equals \\(-1\\) exactly at the midpoint of the demand curve.",
    a:"True. At the midpoint: \\(P^* = a/(2b)\\), \\(Q^* = a/2\\).\n\n\\[e_d = -b \\cdot \\frac{a/(2b)}{a/2} = -b \\cdot \\frac{1}{b} = -1\\]\n\nAbove the midpoint: \\(|e_d| > 1\\) (elastic). Below: \\(|e_d| < 1\\) (inelastic). Total revenue is maximised at the midpoint." },

  { id:14, type:"T/F",
    q:"True or False: A firm can always raise revenue by cutting price.",
    a:"False. Cutting price raises revenue only when demand is elastic (\\(|e_d| > 1\\)) - the quantity gain dominates.\n\nIf demand is inelastic (\\(|e_d| < 1\\)), cutting price lowers revenue because the quantity gain is proportionally smaller than the price cut.\n\nThe correct rule: cut price when elastic; raise price when inelastic." },

  { id:15, type:"Def",
    q:"Define consumer surplus. What area represents it on a standard demand diagram?",
    a:"Consumer surplus (CS) is the gap between a consumer's willingness to pay (the demand curve) and the price actually paid.\n\n\\[CS = \\text{Area of triangle above market price, below demand curve}\\]\n\nFor linear demand \\(Q = a - bP\\) at market price \\(P^*\\):\n\\[CS = \\tfrac{1}{2}\\cdot Q^*\\cdot\\left(\\tfrac{a}{b} - P^*\\right)\\]\n\nwhere \\(a/b\\) is the choke price (x-intercept of inverse demand)." },

  { id:16, type:"Eq",
    q:"For \\(Q = a - bP\\) with market price \\(P^*\\), derive consumer surplus step by step.",
    a:"Step 1 - Choke price: set \\(Q=0 \\Rightarrow P_{\\max} = a/b\\).\nStep 2 - Quantity at \\(P^*\\): \\(Q^* = a - bP^*\\).\nStep 3 - CS = area of right triangle with base \\(Q^*\\) and height \\((P_{\\max} - P^*)\\):\n\n\\[CS = \\tfrac{1}{2}(a - bP^*)\\left(\\tfrac{a}{b} - P^*\\right)\\]\n\nWhen price rises by \\(\\Delta P\\), the CS loss = rectangle \\(Q^*\\Delta P\\) + small triangle \\(\\tfrac{1}{2}\\Delta Q\\cdot\\Delta P\\)." },

  { id:17, type:"Graph",
    q:"At what price is total revenue maximised on a linear demand curve, and why?",
    a:"TR is maximised where \\(e_d = -1\\) - at the midpoint of the linear demand curve, \\(P^* = a/(2b)\\).\n\nFor \\(Q = a - bP\\): \\(TR = aP - bP^2\\). Differentiating: \\(dTR/dP = a - 2bP = 0 \\Rightarrow P^* = a/(2b)\\).\n\nAbove \\(P^*\\): elastic region, TR rises as P falls. Below \\(P^*\\): inelastic region, TR falls as P falls. So the maximum is at the unit-elastic midpoint." },

  { id:18, type:"App",
    q:"Old Navy scenario: the company wants to raise revenue from clothing. What must they determine, and what is the likely recommendation?",
    a:"They need to estimate the price elasticity of demand for their clothing.\n\nIf \\(|e_d| > 1\\) (elastic): cut price → TR rises. The quantity gain dominates.\nIf \\(|e_d| < 1\\) (inelastic): raise price → TR rises. The price gain dominates.\n\nFor fast-fashion with many close substitutes and flexible consumers: demand is likely elastic. Recommendation: run promotions and cut prices to drive volume, rather than raising prices." },

  { id:19, type:"App",
    q:"State two key determinants of price elasticity of demand and explain the direction of effect.",
    a:"1. Number of close substitutes - More substitutes → more elastic. If the price of X rises, consumers switch easily to alternatives. Narrow market definitions (Diet Pepsi) yield higher \\(|e_d|\\) than broad ones (soft drinks).\n\n2. Time horizon - Longer run → more elastic. Consumers have more time to adjust behaviour, find alternatives, or change capital (e.g. switch from petrol cars to electric). Short-run gasoline demand is inelastic; long-run is more elastic." },

  { id:20, type:"Graph",
    q:"Why does the market demand curve have a kink when consumers have different reservation prices?",
    a:"Market demand is the horizontal sum of individual demands at each price. As price falls below each consumer's reservation (choke) price, they enter the market - adding their demand slope to the total.\n\nAt each entry price, the market demand curve becomes flatter (more responsive) because more consumers now react to price changes. The kink marks the price at which a new buyer segment joins.\n\nExample: if consumer A has choke price \\$30 and B has \\$15, the market curve kinks at \\$15. Below \\$15, both A and B respond, so the slope is steeper than above \\$15." },
];

const TS = {
  Def:   { bg:"#E6F1FB", color:"#185FA5", label:"Definition" },
  "T/F": { bg:"#FAEEDA", color:"#854F0B", label:"True / False" },
  Eq:    { bg:"#EAF3DE", color:"#3B6D11", label:"Equation" },
  Graph: { bg:"#FAECE7", color:"#993C1D", label:"Graphical" },
  App:   { bg:"#F3E8FF", color:"#6B21A8", label:"Application" },
};
const TYPES = ["All", "Def", "T/F", "Eq", "Graph", "App"];
const RLABEL = { got:"Got it", almost:"Almost", missed:"Missed" };
const RSYM   = { got:"✓", almost:"~", missed:"✕" };
const RCOLORS = { got:"#3B6D11", almost:"#854F0B", missed:"#993C1D" };
const RBGS    = { got:"#EAF3DE", almost:"#FAEEDA", missed:"#FAECE7" };

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

let state = {
  filter: "All", deck: shuffle(CARDS), idx: 0, flipped: false,
  ratings: {}, done: false, streak: 0, bestStreak: 0,
};

function base() { return state.filter === "All" ? CARDS : CARDS.filter(c => c.type === state.filter); }
function card() { return state.deck[state.idx]; }
function pct()  { return Math.round((state.idx / state.deck.length) * 100); }
function got()    { return Object.values(state.ratings).filter(r => r === "got").length; }
function almost() { return Object.values(state.ratings).filter(r => r === "almost").length; }
function missed() { return Object.values(state.ratings).filter(r => r === "missed").length; }
function total()  { return got() + almost() + missed(); }

const root = document.getElementById('fc-root');

function hdrRightHTML() {
  return state.streak >= 2
    ? `<div style="display:flex;align-items:center;gap:8px"><span class="fc-streak">🔥 ${state.streak}</span><span class="fc-ctr">${state.idx+1} / ${state.deck.length}</span></div>`
    : `<span class="fc-ctr">${state.idx+1} / ${state.deck.length}</span>`;
}

function cardZoneHTML(c, ts) {
  return `
    <div class="fc-scene">
      <div class="fc-card-inner" id="fc-inner" style="position:relative">
        <div class="fc-front" id="fc-front-el">
          <div class="fc-q">${c.q}</div>
          <div class="fc-hint">tap to flip &nbsp;<span class="fc-kbd">space</span></div>
        </div>
        <div class="fc-back">
          <div class="fc-q-sm">${c.q}</div>
          <div class="fc-a">${c.a}</div>
        </div>
      </div>
    </div>`;
}

function revealBtnsHTML() {
  return `<div class="fc-reveal">
    <div class="fc-rate-label">How did you do? &nbsp;<span class="fc-kbd">1</span><span class="fc-kbd">2</span><span class="fc-kbd">3</span></div>
    <div class="fc-rate-row">
      ${[["got","#3B6D11","#EAF3DE","1"],["almost","#854F0B","#FAEEDA","2"],["missed","#993C1D","#FAECE7","3"]].map(([key,color,bg,k]) => `
        <button class="fc-rbtn" style="border-color:${bg};color:${color}" data-rate="${key}">
          <span style="font-size:15px">${RSYM[key]}</span>
          ${RLABEL[key]}
          <span class="kh"><span class="fc-kbd">${k}</span></span>
        </button>`).join('')}
    </div>
  </div>`;
}

function attachCardHandlers() {
  const fe = document.getElementById('fc-front-el');
  if (fe) fe.addEventListener('click', flipCard);
  root.querySelectorAll('.fc-rbtn').forEach(btn => btn.addEventListener('click', () => rate(btn.dataset.rate)));
}

function render() { if (state.done) { renderDone(); return; } renderCard(); }

function renderCard() {
  const c = card(); if (!c) return;
  const ts = TS[c.type] || TS.Def;
  root.innerHTML = `
    <div class="fc-hdr">
      <span class="fc-title">EC224 · Week 4</span>
      ${hdrRightHTML()}
    </div>
    <div class="fc-prog"><div class="fc-prog-fill" style="width:${pct()}%"></div></div>
    <div class="fc-filters">
      ${TYPES.map(t => `<button class="fc-ftag${state.filter===t?' active':''}" data-filter="${t}">${t==="All"?"All types":(TS[t]?.label||t)}</button>`).join('')}
    </div>
    <span class="fc-badge" style="background:${ts.bg};color:${ts.color}">${ts.label}</span>
    <div id="fc-card-zone">${cardZoneHTML(c, ts)}</div>
  `;
  root.querySelectorAll('.fc-ftag').forEach(btn => btn.addEventListener('click', () => applyFilter(btn.dataset.filter)));
  attachCardHandlers();
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([root]).catch(()=>{});
}

function flipCard() {
  if (state.flipped) return;
  state.flipped = true;
  const inner = document.getElementById('fc-inner');
  const zone  = document.getElementById('fc-card-zone');
  if (inner && zone) {
    inner.classList.add('flipped');
    setTimeout(function() {
      if (zone.querySelector('.fc-reveal')) return;
      const div = document.createElement('div');
      div.innerHTML = revealBtnsHTML();
      const reveal = div.firstElementChild;
      zone.appendChild(reveal);
      reveal.querySelectorAll('.fc-rbtn').forEach(btn => btn.addEventListener('click', () => rate(btn.dataset.rate)));
    }, 320);
    return;
  }
  render();
}

function rate(key) {
  const c = card(); if (!c) return;
  state.ratings = { ...state.ratings, [c.id]: key };
  const newStreak = key === "got" ? state.streak + 1 : 0;
  state.streak = newStreak;
  if (newStreak > state.bestStreak) state.bestStreak = newStreak;

  const next = state.idx + 1;
  let nextDeck = state.deck, nextIdx = next, willDone = false;
  if (next >= state.deck.length) {
    const retry = state.deck.filter(cc => state.ratings[cc.id] !== "got");
    if (!retry.length) { willDone = true; }
    else { nextDeck = shuffle(retry); nextIdx = 0; }
  }

  const zone = document.getElementById('fc-card-zone');
  if (!zone) {
    if (willDone) { state.done = true; render(); return; }
    state.deck = nextDeck; state.idx = nextIdx; state.flipped = false; render(); return;
  }

  zone.classList.add('fc-zone-exit');
  zone.addEventListener('animationend', function onExit() {
    zone.removeEventListener('animationend', onExit);
    zone.classList.remove('fc-zone-exit');
    if (willDone) { state.done = true; render(); return; }
    state.deck = nextDeck; state.idx = nextIdx; state.flipped = false;

    const hdrEl = root.querySelector('.fc-hdr');
    if (hdrEl) hdrEl.innerHTML = `<span class="fc-title">EC224 · Week 4</span>${hdrRightHTML()}`;
    const pf = root.querySelector('.fc-prog-fill');
    if (pf) pf.style.width = pct() + '%';

    const c2 = card(), ts2 = TS[c2.type] || TS.Def;
    const badge = root.querySelector('.fc-badge');
    if (badge) { badge.style.background = ts2.bg; badge.style.color = ts2.color; badge.textContent = ts2.label; }

    zone.innerHTML = cardZoneHTML(c2, ts2);
    zone.classList.add('fc-zone-enter');
    zone.addEventListener('animationend', function onEnter() {
      zone.removeEventListener('animationend', onEnter);
      zone.classList.remove('fc-zone-enter');
    }, { once: true });

    attachCardHandlers();
    if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([zone]).catch(()=>{});
  }, { once: true });
}

function renderDone() {
  const g = got(), a = almost(), m = missed(), tot = total();
  const pctGot = tot ? Math.round((g/tot)*100) : 0;
  const missedCards = base().filter(c => state.ratings[c.id] !== "got");
  root.innerHTML = `
    <div class="fc-hdr">
      <span class="fc-title">EC224 · Week 4</span>
      ${state.bestStreak > 2 ? `<span class="fc-streak">🔥 Best: ${state.bestStreak}</span>` : ''}
    </div>
    <div class="fc-summary">
      <div class="fc-sum-title">Deck complete</div>
      <div style="font-size:13px;color:#666">
        ${g === tot ? "Perfect round. You nailed every card." : `${pctGot}% confidence · ${tot} cards rated`}
      </div>
      <div class="fc-stat-row">
        <div class="fc-stat" style="background:#EAF3DE"><span class="fc-stat-n" style="color:#3B6D11">${g}</span><span class="fc-stat-l" style="color:#3B6D11">Got it</span></div>
        <div class="fc-stat" style="background:#FAEEDA"><span class="fc-stat-n" style="color:#854F0B">${a}</span><span class="fc-stat-l" style="color:#854F0B">Almost</span></div>
        <div class="fc-stat" style="background:#FAECE7"><span class="fc-stat-n" style="color:#993C1D">${m}</span><span class="fc-stat-l" style="color:#993C1D">Missed</span></div>
      </div>
      <div class="fc-bar-track">
        <div class="fc-bar-seg" style="width:${tot?Math.round((g/tot)*100):0}%;background:#3B6D11"></div>
        <div class="fc-bar-seg" style="width:${tot?Math.round((a/tot)*100):0}%;background:#854F0B"></div>
        <div class="fc-bar-seg" style="width:${tot?Math.round((m/tot)*100):0}%;background:#993C1D"></div>
      </div>
      ${g < tot ? `<div style="font-size:12px;color:#999">Tip: review missed cards in the textbook and try the interactive visualizations before your next problem set.</div>` : ''}
      <div class="fc-btn-row">
        ${missedCards.length > 0 ? `<button class="fc-btn-outline" id="btn-retry">Retry weak cards (${missedCards.length})</button>` : ''}
        <button class="fc-btn-primary" id="btn-restart">Start again</button>
      </div>
    </div>
  `;
  document.getElementById('btn-retry')?.addEventListener('click', () => restart(true));
  document.getElementById('btn-restart')?.addEventListener('click', () => restart(false));
}

function applyFilter(f) {
  state.filter = f;
  const src = f === "All" ? CARDS : CARDS.filter(c => c.type === f);
  state.deck = shuffle(src);
  state.idx = 0; state.flipped = false;
  state.ratings = {}; state.done = false; state.streak = 0; state.bestStreak = 0;
  render();
}

function restart(missedOnly) {
  const src = missedOnly ? base().filter(c => state.ratings[c.id] !== "got") : base();
  state.deck = shuffle(src); state.idx = 0; state.flipped = false;
  state.ratings = {}; state.done = false; state.streak = 0; state.bestStreak = 0;
  render();
}

document.addEventListener('keydown', e => {
  if (state.done) return;
  if (e.code === 'Space') { e.preventDefault(); if (!state.flipped) flipCard(); }
  if (state.flipped) {
    if (e.key === '1') rate('got');
    if (e.key === '2') rate('almost');
    if (e.key === '3') rate('missed');
  }
});

render();

function openLN()  { document.getElementById('leftNav').classList.add('open'); document.getElementById('lnOverlay').classList.add('open'); }
function closeLN() { document.getElementById('leftNav').classList.remove('open'); document.getElementById('lnOverlay').classList.remove('open'); }
</script>
</body>
